[project]
name = "hyrule-mcp"
version = "0.1.0"
description = "MCP server exposing AS215932 infrastructure tools (SSH, Prometheus, Icinga2, FRR, DNS)"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.27.0",
    "paramiko>=4.0.0",
    "requests>=2.33.0",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[project.scripts]
hyrule-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mcp_server.py"]

[tool.hatch.build.targets.wheel.sources]
"mcp_server.py" = "mcp_server.py"
