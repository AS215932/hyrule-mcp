[project]
name = "hyrule-mcp"
version = "0.1.0"
description = "MCP server exposing AS215932 infrastructure tools (SSH, Prometheus, Icinga2, FRR, DNS)"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.27.0",
    "paramiko>=4.0.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
hyrule-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mcp_server.py", "hyrule_mcp"]

[tool.hatch.build.targets.wheel.sources]
"mcp_server.py" = "mcp_server.py"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"mcp_server.py" = ["F401", "F403", "RUF100"]
"hyrule_mcp/tools/__init__.py" = ["F401", "F403", "RUF100"]
"tests/*.py" = ["F401", "RUF012"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
